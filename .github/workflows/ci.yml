name: CI & Terraform Guardrails Validation
on: [push, pull_request]

permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Unit Tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Validate Terraform Guardrails
        run: python guardrail_validator.py --policy-file policies/landing_zone_guardrails.json
